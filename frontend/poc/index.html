<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PMFA — Squat Analysis POC</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.2/dist/chart.umd.min.js"></script>
  <!-- MediaPipe BlazePose — loaded as global before ES module -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils@0.3.1675466862/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose@0.5.1675469404/pose.js" crossorigin="anonymous"></script>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app">
    <header>
      <h1>PMFA <span class="subtitle">Squat Analysis — POC</span></h1>
    </header>

    <main>
      <section id="source-section">
        <div id="camera-error" class="hidden">
          <strong>Camera access denied.</strong>
          <span id="camera-error-detail"></span>
          <ol>
            <li>Click the camera icon in your browser's address bar and allow access, <strong>or</strong></li>
            <li>Go to <em>System Settings → Privacy &amp; Security → Camera</em> and enable your browser.</li>
          </ol>
          <button id="camera-error-dismiss">Dismiss</button>
        </div>
        <div id="source-picker">
          <label for="video-input" id="btn-upload" class="source-btn">
            Upload Video
            <input type="file" id="video-input" accept="video/*" />
          </label>
          <button id="btn-webcam" class="source-btn">Open Webcam</button>
        </div>
      </section>

      <section id="analysis-section" class="hidden">
        <div id="video-container">
          <video id="video" playsinline></video>
          <canvas id="overlay"></canvas>
          <div id="webcam-badge" class="hidden">LIVE</div>
        </div>

        <div id="controls">
          <button id="play-pause" class="hidden">Play</button>
          <button id="stop-webcam" class="hidden">Stop Camera</button>
          <input type="range" id="scrubber" min="0" max="100" value="0" step="0.1" />
          <span id="time-display">0.00s</span>
          <button id="mute-radar" title="Mute radar alerts">🔔</button>
        </div>

        <div id="rep-status" class="hidden">
          <span id="rep-counter">Rep 0</span>
          <span id="rep-score-badge">—</span>
          <span id="session-score"></span>
        </div>

        <div id="violations" class="hidden">
          <h3>Violations</h3>
          <ul id="violation-list"></ul>
        </div>

        <div id="fatigue-banner" class="hidden"></div>

        <div id="rep-history-panel" class="hidden">
          <button id="rep-history-toggle">
            <span>Rep History</span>
            <span id="rep-history-chevron">▼</span>
          </button>
          <ul id="rep-history-list" class="hidden"></ul>
        </div>
      </section>

      <section id="chart-section" class="hidden">
        <h2>Angles Over Time</h2>
        <canvas id="angle-chart"></canvas>
      </section>

      <section id="debug-section">
        <h2>Debug Log</h2>
        <pre id="debug-log"></pre>
      </section>
    </main>
  </div>

  <script type="module" src="main.js"></script>
</body>
</html>
